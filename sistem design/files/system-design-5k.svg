<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SmartList estágio 2 — cache com Redis</title>
  <desc>Arquitetura com Redis para cache do ranking de preços por bairro, até 5.000 usuários</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, sans-serif; fill: #2C2C2A; }
    .label-md { font-size: 13px; font-weight: 500; }
    .label-muted { font-size: 12px; fill: #5F5E5A; }
    .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .box-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .box-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .box-dashed { fill: none; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 6 4; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-teal { stroke: #1D9E75; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-blue { stroke: #378ADD; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-purple { stroke: #7F77DD; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="340" y="26" text-anchor="middle" class="label-muted">Estágio 2 — até ~5.000 usuários</text>

  <rect x="40" y="48" width="140" height="56" rx="8" class="box-teal"/>
  <text x="110" y="74" text-anchor="middle" class="label-md" fill="#085041">React app</text>
  <text x="110" y="92" text-anchor="middle" class="label-muted" fill="#0F6E56">Netlify CDN</text>

  <line x1="180" y1="76" x2="218" y2="76" class="arr-teal"/>

  <rect x="220" y="48" width="160" height="56" rx="8" class="box-blue"/>
  <text x="300" y="74" text-anchor="middle" class="label-md" fill="#0C447C">Spring Boot</text>
  <text x="300" y="92" text-anchor="middle" class="label-muted" fill="#185FA5">Virtual Threads</text>

  <path d="M380 63 L458 63" class="arr-blue"/>
  <text x="419" y="54" text-anchor="middle" class="label-muted">cache hit</text>

  <rect x="460" y="38" width="160" height="56" rx="8" class="box-amber"/>
  <text x="540" y="64" text-anchor="middle" class="label-md" fill="#633806">Redis</text>
  <text x="540" y="82" text-anchor="middle" class="label-muted" fill="#854F0B">Ranking por bairro</text>

  <path d="M380 89 L458 138" class="arr-blue"/>
  <text x="408" y="128" text-anchor="middle" class="label-muted">cache miss</text>

  <rect x="460" y="128" width="160" height="56" rx="8" class="box-purple"/>
  <text x="540" y="154" text-anchor="middle" class="label-md" fill="#3C3489">PostgreSQL</text>
  <text x="540" y="172" text-anchor="middle" class="label-muted" fill="#534AB7">Fonte da verdade</text>

  <path d="M540 128 L540 94" class="arr-purple"/>
  <text x="556" y="114" text-anchor="start" class="label-muted">atualiza</text>

  <rect x="40" y="224" width="600" height="90" rx="12" class="box-dashed"/>
  <text x="56" y="244" class="label-muted">Estratégia cache-aside</text>
  <text x="60" y="266" class="label-muted">1. Spring verifica Redis → cache hit? Retorna direto.</text>
  <text x="60" y="286" class="label-muted">2. Cache miss → vai ao banco, calcula ranking, salva no Redis (TTL 15 min).</text>
  <text x="60" y="306" class="label-muted">3. Novo preço registrado → invalida cache do bairro imediatamente.</text>
</svg>
