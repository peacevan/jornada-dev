<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SmartList estágio 3 — Kafka e múltiplas instâncias</title>
  <desc>Arquitetura com load balancer, múltiplas instâncias Spring Boot, Kafka, Redis e PostgreSQL com read replica, até 50.000 usuários</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, sans-serif; fill: #2C2C2A; }
    .label-md { font-size: 13px; font-weight: 500; }
    .label-muted { font-size: 12px; fill: #5F5E5A; }
    .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .box-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .box-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .box-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-teal { stroke: #1D9E75; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-blue { stroke: #378ADD; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-purple { stroke: #7F77DD; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arr-coral { stroke: #993C1D; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="340" y="26" text-anchor="middle" class="label-muted">Estágio 3 — até ~50.000 usuários</text>

  <rect x="20" y="48" width="120" height="56" rx="8" class="box-teal"/>
  <text x="80" y="74" text-anchor="middle" class="label-md" fill="#085041">React app</text>
  <text x="80" y="92" text-anchor="middle" class="label-muted" fill="#0F6E56">CDN global</text>

  <line x1="140" y1="76" x2="178" y2="76" class="arr-teal"/>

  <rect x="180" y="48" width="130" height="56" rx="8" class="box-gray"/>
  <text x="245" y="72" text-anchor="middle" class="label-md" fill="#444441">Load balancer</text>
  <text x="245" y="90" text-anchor="middle" class="label-muted">Nginx / AWS ALB</text>

  <path d="M310 63 L368 52" class="arr"/>
  <path d="M310 89 L368 100" class="arr"/>

  <rect x="370" y="40" width="130" height="30" rx="6" class="box-blue"/>
  <text x="435" y="59" text-anchor="middle" class="label-md" fill="#0C447C">Instância 1</text>

  <rect x="370" y="86" width="130" height="30" rx="6" class="box-blue"/>
  <text x="435" y="105" text-anchor="middle" class="label-md" fill="#0C447C">Instância 2</text>

  <path d="M500 52 L558 90" class="arr-blue"/>
  <path d="M500 100 L558 108" class="arr-blue"/>

  <rect x="560" y="58" width="100" height="56" rx="8" class="box-amber"/>
  <text x="610" y="82" text-anchor="middle" class="label-md" fill="#633806">Redis</text>
  <text x="610" y="100" text-anchor="middle" class="label-muted" fill="#854F0B">Cache + sessão</text>

  <line x1="435" y1="116" x2="435" y2="162" class="arr-blue"/>
  <text x="452" y="146" text-anchor="start" class="label-muted">publica</text>

  <rect x="310" y="164" width="250" height="56" rx="8" class="box-coral"/>
  <text x="435" y="190" text-anchor="middle" class="label-md" fill="#712B13">Kafka</text>
  <text x="435" y="208" text-anchor="middle" class="label-muted" fill="#993C1D">Fila de registros de preço</text>

  <line x1="435" y1="220" x2="435" y2="268" class="arr-coral"/>
  <text x="452" y="252" text-anchor="start" class="label-muted">consome</text>

  <rect x="310" y="270" width="250" height="56" rx="8" class="box-blue"/>
  <text x="435" y="296" text-anchor="middle" class="label-md" fill="#0C447C">Price consumer</text>
  <text x="435" y="314" text-anchor="middle" class="label-muted" fill="#185FA5">Persiste e invalida cache</text>

  <path d="M310 298 L258 298" class="arr-blue"/>

  <rect x="80" y="218" width="170" height="56" rx="8" class="box-purple"/>
  <text x="165" y="244" text-anchor="middle" class="label-md" fill="#3C3489">PostgreSQL</text>
  <text x="165" y="262" text-anchor="middle" class="label-muted" fill="#534AB7">Primary (escrita)</text>

  <path d="M165 274 L165 328" class="arr-purple"/>

  <rect x="80" y="330" width="170" height="56" rx="8" class="box-purple"/>
  <text x="165" y="356" text-anchor="middle" class="label-md" fill="#3C3489">Read replica</text>
  <text x="165" y="374" text-anchor="middle" class="label-muted" fill="#534AB7">Leituras do ranking</text>

  <text x="340" y="408" text-anchor="middle" class="label-muted">Virtual Threads: milhares de conexões simultâneas sem thread do SO por requisição</text>
</svg>
